# GitHub Pages for this repo publishes the main branch root (legacy "Deploy from a branch").
# This workflow does not deploy and does not change that setting, so a pull request
# cannot replace the live site. On main, Pages publishes the committed build.
# The job rebuilds that site and fails if the committed files drifted.
name: Pages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Committed Pages files match the build
        run: git diff --exit-code
